name: Mise a jour espace presse
on:
  schedule:
    - cron: "30 5 * * *"   # tous les jours vers 7h30 (heure de Paris en Ã©tÃ©)
  workflow_dispatch:        # permet aussi de le lancer Ã  la main
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python espace_presse.py
      - run: |
          git config user.name "robot-presse"
          git config user.email "robot@users.noreply.github.com"
          git add docs
          git commit -m "Mise a jour du jour" || echo "rien a commiter"
          git push
